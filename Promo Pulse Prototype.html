<title>Promo Pulse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=swap">
<style>
/* Layout: SAP Fiori (Horizon) app. Shell bar with Joule search, side navigation rail, object-page header with blue top bar and icon tab bar, analytical insight cards, tab content, Joule side panel, message toasts */
:root{
  --bg:#F5F6F7; --surface:#FFFFFF; --sunk:#F2F4F5; --hover:#EAECEE; --ink:#1D2D3E; --muted:#556B82; --line:#E5E5E5; --field:#BCC3CA; --track:#E1E6EB; --tick:#1D2D3E;
  --accent:#0064D9; --accent-fill:#0070F2; --accent-hover:#0064D9; --accent-soft:#E1F4FF; --info-line:#A6D8FF; --accent-ring:rgba(0,112,242,.45); --on-accent:#FFFFFF; --avatar:#5D36FF;
  --cpg:#07838F; --cpg-soft:#DAF6F5;
  --good:#256F3A; --good-soft:#F5FAE5; --pos-fill:#30914C;
  --warn:#B44F00; --warn-soft:#FFF8D6; --warn-line:#FFD37A; --crit-fill:#E76500;
  --bad:#AA0808; --bad-soft:#FFEAF4; --neg-fill:#D20A0A;
  --scrim:rgba(29,45,62,.28); --toast-bg:#223548; --toast-ink:#FFFFFF; --toast-link:#7CC4FF;
  --shadow:0 0 2px rgba(34,53,72,.14),0 2px 4px rgba(34,53,72,.14); --shadow2:0 0 4px rgba(34,53,72,.16),0 8px 16px rgba(34,53,72,.16);
  --display:'72','72full','Source Sans 3',Arial,Helvetica,sans-serif;
  --body:'72','72full','Source Sans 3',Arial,Helvetica,sans-serif;
  --mono:'72Mono','SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171C; --surface:#1D232A; --sunk:#242B33; --hover:#2C343D; --ink:#EAECEE; --muted:#A9B4BE; --line:#333C46; --field:#5B6B7B; --track:#2E3843; --tick:#EAECEE;
  --accent:#4DB1FF; --accent-fill:#0070F2; --accent-hover:#1C84FF; --accent-soft:#0F2D4A; --info-line:#1D5687; --accent-ring:rgba(77,177,255,.45); --on-accent:#FFFFFF; --avatar:#7858FF;
  --cpg:#4DD0C8; --cpg-soft:#0F3534;
  --good:#5DC122; --good-soft:#18301A; --pos-fill:#3FA35A;
  --warn:#F0A43B; --warn-soft:#3B2C10; --warn-line:#6B4A12; --crit-fill:#F07C28;
  --bad:#FF8888; --bad-soft:#45171C; --neg-fill:#E52929;
  --scrim:rgba(0,0,0,.5); --toast-bg:#EAECEE; --toast-ink:#1D2D3E; --toast-link:#0064D9;
  --shadow:0 0 2px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.4); --shadow2:0 0 4px rgba(0,0,0,.5),0 8px 16px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1D232A; --sunk:#242B33; --hover:#2C343D; --ink:#EAECEE; --muted:#A9B4BE; --line:#333C46; --field:#5B6B7B; --track:#2E3843; --tick:#EAECEE;
  --accent:#4DB1FF; --accent-fill:#0070F2; --accent-hover:#1C84FF; --accent-soft:#0F2D4A; --info-line:#1D5687; --accent-ring:rgba(77,177,255,.45); --on-accent:#FFFFFF; --avatar:#7858FF;
  --cpg:#4DD0C8; --cpg-soft:#0F3534;
  --good:#5DC122; --good-soft:#18301A; --pos-fill:#3FA35A;
  --warn:#F0A43B; --warn-soft:#3B2C10; --warn-line:#6B4A12; --crit-fill:#F07C28;
  --bad:#FF8888; --bad-soft:#45171C; --neg-fill:#E52929;
  --scrim:rgba(0,0,0,.5); --toast-bg:#EAECEE; --toast-ink:#1D2D3E; --toast-link:#0064D9;
  --shadow:0 0 2px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.4); --shadow2:0 0 4px rgba(0,0,0,.5),0 8px 16px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[data-ic]{display:inline-flex}
svg.i{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.neg{color:var(--bad)}
.pos-t{color:var(--good)}
.crit-t{color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

/* shell bar */
.shell{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;min-height:56px;background:var(--surface);box-shadow:var(--shadow);position:relative;z-index:5;
  margin:0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 16px calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-block:6px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.saplogo{display:block;height:28px;width:auto;max-width:none;flex:none;margin-right:4px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent-fill);color:var(--on-accent);display:grid !important;place-items:center;flex:none}
.brand b{display:block;font-size:16px;line-height:1.2}
.brand span{display:block;font-size:12.5px;color:var(--muted)}
.search{justify-self:center;width:min(560px,100%);display:flex;align-items:center;gap:8px;height:38px;border-radius:19px;background:var(--sunk);border:1px solid var(--line);padding-left:14px;padding-right:6px;color:var(--muted)}
.search:focus-within{border-color:var(--accent);background:var(--surface)}
.search input{flex:1;min-width:0;border:none;background:transparent;outline:none;height:100%;color:var(--ink);font-size:14px}
.search input::placeholder{color:var(--muted)}
.shell-r{display:flex;align-items:center;gap:4px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:none;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:var(--hover)}
.iconbtn.jb{color:var(--accent)}
.badge{position:absolute;top:2px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--neg-fill);color:var(--on-accent);font-size:10.5px;font-weight:700;line-height:16px;text-align:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--avatar);color:var(--on-accent);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none;margin-left:4px}

/* app frame */
.app{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:60px minmax(0,1fr);gap:16px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px);display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.rb{position:relative;width:44px;height:44px;border-radius:12px;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.rb:hover{background:var(--hover);color:var(--ink)}
.rb[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.rb[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.rb .dotb{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--accent-fill);color:var(--on-accent);font-size:10px;font-weight:700;line-height:16px;text-align:center;padding:0 4px}
.rail-sep{height:1px;background:var(--line);margin:4px 6px}
main{display:flex;flex-direction:column;gap:16px;min-width:0}

/* object page header */
.ohead{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ohead::before{content:"";display:block;height:6px;background:var(--accent-fill)}
.ohead-in{padding:16px 20px 4px;display:flex;flex-direction:column;gap:14px}
.ttl{display:flex;gap:14px;align-items:center;min-width:0}
.ttl .mark{width:46px;height:46px;border-radius:13px}
.ohead h1{font-size:22px;font-weight:700;line-height:1.2}
.datechip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;background:var(--sunk);font-size:13px;color:var(--muted)}
.datechip b{color:var(--ink)}
.kvs{display:flex;flex-wrap:wrap;gap:12px 44px;padding-bottom:12px}
.kvs div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kvs span{font-size:13px;color:var(--muted)}
.kvs b{font-size:16px;font-weight:400}
.kvs.sm{gap:10px 32px;padding:0}
.kvs.sm b{font-size:15px;font-weight:600}
.tabbar{display:flex;gap:2px;padding:0 12px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabbar button{display:flex;align-items:center;gap:7px;min-height:50px;padding:0 14px;border:none;background:transparent;cursor:pointer;color:var(--ink);font-size:14px;position:relative;white-space:nowrap}
.tabbar button:hover{color:var(--accent)}
.tabbar button[aria-selected="true"]{color:var(--accent);font-weight:700}
.tabbar button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.cnt{font-size:11.5px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--sunk);color:var(--muted);display:grid;place-items:center}
.cnt.hot{background:var(--accent-fill);color:var(--on-accent)}

/* cards */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;border:2px solid transparent;transition:box-shadow .2s,transform .2s,border-color .2s}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h3{font-size:15px;font-weight:700;line-height:1.3}
.card-h small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:0 4px}
.sec-h h2{font-size:16px;font-weight:700}

/* insight cards */
.insights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.big{font-size:36px;font-weight:300;line-height:1.05;font-variant-numeric:tabular-nums}
.big .u{font-size:14px;font-weight:400;color:var(--muted);margin-left:5px}
.ind{font-size:15px;font-weight:700;margin-left:6px}
.legend-l{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.lrow{display:flex;align-items:center;gap:6px;justify-content:space-between}
.lrow>span{display:flex;align-items:center;gap:6px;min-width:0}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;display:flex;gap:2px}
.bar>i{display:block;height:100%;border-radius:4px}
.bar.thin{height:6px}
.bar.lg{height:12px;border-radius:6px}
.tv{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px}
.tv div{display:flex;flex-direction:column}
.tv span{color:var(--muted)}
.tv b{font-size:14px;font-weight:600}

/* status (Fiori ObjectStatus, inverted) */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;line-height:1.45}
.tag.neg{color:var(--bad);background:var(--bad-soft)}
.tag.crit{color:var(--warn);background:var(--warn-soft)}
.tag.pos{color:var(--good);background:var(--good-soft)}
.tag.info{color:var(--accent);background:var(--accent-soft)}
.tag.none{color:var(--muted);background:var(--sunk)}
.tag.sm{font-size:11px;padding:1px 6px}
.pulse{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pp 1.6s ease-in-out infinite;flex:none}
@keyframes pp{0%,100%{opacity:1}50%{opacity:.3}}
.count{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.count.hot{color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--field);background:var(--surface);color:var(--accent);font-weight:700;font-size:13.5px;cursor:pointer;transition:background .15s,transform .1s,border-color .15s}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.small{min-height:30px;padding:0 10px;font-size:12.5px}
.btn.lg{min-height:44px;padding:0 20px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* message strip */
.strip{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:13px;border:1px solid}
.strip>svg{margin-top:1px}
.strip.info{background:var(--accent-soft);border-color:var(--info-line)}
.strip.info>svg{color:var(--accent)}

/* suggest */
.sg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.1fr);gap:16px;align-items:start}
.trig{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.trig:hover{box-shadow:var(--shadow2);transform:translateY(-1px)}
.trig[aria-pressed="true"]{border-color:var(--accent);box-shadow:var(--shadow2)}
.mid{font-size:24px;font-weight:300;line-height:1.1}
.spark{display:block;width:100%;height:46px}
.detail{gap:16px;padding:20px}
.detail h2.dt{font-size:22px;font-weight:700;line-height:1.2}
.stp{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.stp>h3{display:flex;align-items:center;gap:10px;font-size:15px}
.sn{width:24px;height:24px;border-radius:50%;background:var(--accent-fill);color:var(--on-accent);font-size:12.5px;font-weight:700;display:grid;place-items:center;flex:none}
.optgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.opt:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.opt[aria-pressed="true"]{border:2px solid var(--accent);padding:11px;background:var(--accent-soft)}
.opt-h{display:flex;justify-content:space-between;gap:6px;align-items:flex-start;font-size:14px}
.opt-m{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.opt-m span{color:var(--muted)}
.opt-m b{font-variant-numeric:tabular-nums}
.tunes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.tune{display:flex;flex-direction:column;gap:5px}
.tune-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.tune-h label{color:var(--muted)}
.tune-h b{font-size:16px}
input[type=range]{width:100%;accent-color:var(--accent-fill);min-height:28px;margin:0}
.band{position:relative;height:6px;border-radius:3px;background:var(--track)}
.band span{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--cpg)}
.band i{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.outcome{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.otile{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:var(--sunk);min-width:0}
.otile>span{font-size:12.5px;color:var(--muted)}
.otile>b{font-size:24px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.15}
.otile small{font-size:12px;color:var(--muted)}
.otile.ret{background:var(--accent-soft)}
.otile.cpg{background:var(--cpg-soft)}
.otile.waste{background:var(--good-soft)}
.schips{display:flex;flex-wrap:wrap;gap:6px}
.schip{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:0 11px;border-radius:16px;border:1px solid var(--field);background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:600;transition:opacity .15s,background .15s}
.schip.go svg{color:var(--good)}
.schip.care svg{color:var(--warn)}
.schip[aria-pressed="false"]{opacity:.55;text-decoration:line-through;background:var(--sunk)}
.notes{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;font-size:13px}
.checks li{display:flex;gap:8px;align-items:center}
.ci{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--on-accent)}
.checks .ok .ci{background:var(--pos-fill)}
.checks .no .ci{background:var(--neg-fill)}
.sendrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* execute + tracker */
.ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:16px;align-items:start}
.deal{cursor:pointer}
.deal:hover{box-shadow:var(--shadow2)}
.deal.sel{border-color:var(--accent)}
.miniflow{display:flex;gap:4px}
.miniflow i{flex:1;height:5px;border-radius:3px;background:var(--track)}
.miniflow i.done{background:var(--pos-fill)}
.miniflow i.now{background:var(--accent-fill)}
.miniflow i.part{background:var(--crit-fill)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;border-radius:6px;padding:2px 8px;border:1px solid var(--field)}
.chip.yes{border-color:transparent;background:var(--good-soft);color:var(--good)}
.chip.notyet{border-color:transparent;background:var(--bad-soft);color:var(--bad)}
.pflow{list-style:none;margin:0;padding:4px 0 0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.pflow li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0;padding:0 2px}
.pflow li:not(:first-child)::before{content:"";position:absolute;top:17px;left:-50%;right:50%;height:3px;background:var(--track)}
.pflow li.done::before,.pflow li.now::before,.pflow li.part::before{background:var(--pos-fill)}
.node{position:relative;z-index:1;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--field);color:var(--muted)}
.pflow .done .node{background:var(--pos-fill);border-color:var(--pos-fill);color:var(--on-accent)}
.pflow .now .node{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent);animation:ring 1.8s ease-out infinite}
.pflow .part .node{background:var(--crit-fill);border-color:var(--crit-fill);color:var(--on-accent)}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--accent-ring)}100%{box-shadow:0 0 0 10px transparent}}
.pflow b{font-size:12px}
.pflow small{font-size:11px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0 4px 0 0;display:flex;flex-direction:column;max-height:420px;overflow-y:auto;border-top:1px solid var(--line)}
.tl .date{font-size:11.5px;font-weight:700;color:var(--muted);padding:12px 0 4px}
.tl .ev{display:grid;grid-template-columns:64px 12px minmax(0,1fr);gap:10px;align-items:start;padding:5px 6px;font-size:13px;border-radius:8px}
.tl .t{font-size:12px;color:var(--muted);text-align:right;padding-top:1px;font-variant-numeric:tabular-nums}
.tl .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--muted);box-shadow:0 0 0 3px var(--surface)}
.k-detect{background:var(--neg-fill)!important}
.k-decide{background:var(--muted)!important}
.k-approve{background:var(--pos-fill)!important}
.k-exception{background:var(--crit-fill)!important}
.k-launch{background:var(--ink)!important}
.k-store{background:var(--cpg)!important}
.k-sales{background:var(--accent-fill)!important}
.k-agent{background:var(--avatar)!important}
.k-end{background:var(--pos-fill)!important}
.sys{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:6px;padding:0 6px;margin-left:6px;white-space:nowrap}
.ev.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{from{background:var(--accent-soft)}to{background:transparent}}

/* monitor */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--field);border-radius:10px;overflow:hidden;align-self:flex-start;background:var(--surface)}
.segb{min-height:36px;padding:0 14px;border:none;background:transparent;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.segb+.segb{border-left:1px solid var(--field)}
.segb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.mgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stats>div{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border-radius:12px;background:var(--sunk);min-width:0}
.stats span{font-size:12px;color:var(--muted)}
.stats b{font-size:24px;font-weight:300;line-height:1.15;font-variant-numeric:tabular-nums}
.stats small{font-size:11.5px;color:var(--muted)}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:340px;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lt{display:inline-block;width:16px;height:3px;border-radius:2px;background:var(--tick)}
.srows{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) 74px 70px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.srow:first-child{border-top:none}
.srow .v{text-align:right;font-variant-numeric:tabular-nums}
.sname{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
.bullet{position:relative;height:10px;border-radius:5px;background:var(--track)}
.bullet>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bullet .tg{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--tick);left:83.33%}
.rec{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;padding:12px;border-radius:12px;background:var(--sunk)}
.ricon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.rec .lever{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.rec p{font-size:13px}
.locked{display:flex;flex-direction:column;gap:6px}
.locked div{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}

/* deal room */
.pbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.sigs{display:flex;flex-wrap:wrap;gap:14px}
.sig{display:flex;align-items:center;gap:8px;font-size:12.5px}
.av{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--on-accent);background:var(--avatar);flex:none}
.av.b{background:var(--cpg)}
.av .okb{position:absolute;right:-4px;bottom:-3px;width:15px;height:15px;border-radius:50%;background:var(--pos-fill);border:2px solid var(--surface);display:grid;place-items:center}
.sig.wait .av{opacity:.45}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rgrid>div{background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.rgrid span{font-size:12px;color:var(--muted)}
.rgrid b{font-size:19px;font-weight:300;font-variant-numeric:tabular-nums}
.crow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:12.5px}
.crow b{text-align:right;font-variant-numeric:tabular-nums}
details.ledger summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--accent);min-height:24px}
details.ledger div{font-size:12px;color:var(--muted);padding:2px 0}
.edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.edit label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.edit input{min-height:36px;border-radius:6px;border:1px solid var(--field);background:var(--surface);padding:0 10px;color:var(--ink);font-variant-numeric:tabular-nums}
.card.thread{border-color:var(--crit-fill)}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg.ret{flex-direction:row-reverse}
.bub{border-radius:14px;padding:8px 12px;font-size:13px;max-width:85%;display:flex;flex-direction:column;gap:2px}
.msg.ret .bub{background:var(--accent-soft);border-top-right-radius:4px}
.msg.cpgm .bub{background:var(--cpg-soft);border-top-left-radius:4px}
.bub b{font-size:11.5px}
.ferr{font-size:12.5px;color:var(--bad)}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:48px 16px;color:var(--muted)}
.empty .eic{width:52px;height:52px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center}
.empty h3{color:var(--ink);font-size:16px}
.empty p{max-width:46ch}

/* Joule panel */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:19}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);box-shadow:var(--shadow2);z-index:20;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top, 0px);padding-right:env(safe-area-inset-right, 0px);transform:translateX(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.drawer.open{transform:none;visibility:visible;transition:transform .25s ease}
.dh{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
.dh b{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:16px}
.jmsgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.jq{align-self:flex-end;background:var(--accent-fill);color:var(--on-accent);border-radius:14px 14px 4px 14px;padding:8px 12px;max-width:85%;font-size:13.5px}
.ja{align-self:flex-start;background:var(--sunk);border-radius:14px 14px 14px 4px;padding:10px 12px;max-width:94%;font-size:13.5px;line-height:1.55}
.jsugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.jform{display:flex;gap:8px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--line)}
.jform input{flex:1;min-width:0;min-height:40px;border-radius:10px;border:1px solid var(--field);background:var(--surface);padding:0 12px}

/* toasts */
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:30;width:min(460px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;background:var(--toast-bg);color:var(--toast-ink);border-radius:12px;padding:10px 12px 10px 14px;box-shadow:var(--shadow2);display:flex;gap:10px;align-items:center;font-size:13.5px;animation:tin .25s ease-out}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.toast .tm{flex:1}
.toast .ti{color:var(--pos-fill)}
.tact{border:none;background:transparent;color:var(--toast-link);font-weight:700;cursor:pointer;padding:6px 8px;border-radius:6px;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* entrance motion on view change */
.anim .bar>i,.anim .bullet>i{animation:grow .7s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
.anim .cbar{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;transform-origin:bottom;transform-box:fill-box}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(0)}}

@media (max-width:1180px){.insights{grid-template-columns:repeat(2,minmax(0,1fr))}.mgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1000px){.sg,.ex{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.rail{display:none}}
@media (max-width:720px){
  .shell{grid-template-columns:minmax(0,1fr) auto}.search{grid-column:1/-1;order:3;width:100%}
  .optgrid,.outcome,.tunes,.checks,.edit{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pflow{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:14px}.pflow li:not(:first-child)::before{display:none}
  .srow{grid-template-columns:minmax(0,1fr) auto auto}.srow .bullet{grid-column:1/-1;order:4}
  .ohead-in{padding:14px 14px 4px}.kvs{gap:10px 28px}
}
@media (max-width:560px){.insights{grid-template-columns:minmax(0,1fr)}.brand span{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

function openT(){return TRIGGERS.filter(t=>!S.deals.some(d=>d.id===t.id))}
function liftOf(st,o,executed,boost){return 1+(3.6*o.d+((o.display&&st.display)?0.6:0))*(executed?1:0.3)+(boost||0)}
function storePlan(st,o,D,P,C,G,share,expiry){
  const L=liftOf(st,o,true),baseU=Math.min(st.stock,st.base*D),promoU=Math.min(st.stock,st.base*L*D),incr=promoU-baseU;
  let w0=0,w1=0;if(expiry){w0=Math.max(0,st.stock-st.base*expiry);w1=Math.max(0,st.stock-st.base*L*D-st.base*Math.max(0,expiry-D))}
  const fund=promoU*P*o.d*share;
  return {promoU,incr,wasteAvoid:w0-w1,waste0:w0,fund,ret:promoU*(P*(1-o.d)-C)+fund-baseU*(P-C)+(w0-w1)*C,cpg:incr*G-fund};
}
function trigPlan(t,dr,optId){const o=t.options.find(x=>x.id===(optId||dr.opt));let a={promoU:0,incr:0,wasteAvoid:0,waste0:0,fund:0,ret:0,cpg:0};
  t.stores.filter(st=>!dr.exclude[st.n]).forEach(st=>{const c=storePlan(st,o,dr.days,t.P,t.C,t.G,dr.share,t.expiry);for(const k in a)a[k]+=c[k]});return a}
function atRisk(t){const days=t.kind==='Overstock'?14:t.expiry;return t.stores.reduce((s,st)=>s+Math.max(0,st.stock-st.base*days),0)}
function daysLeft(t){return Math.max(0,t.bb-S.today)}
function readiness(t,dr){const o=t.options.find(x=>x.id===dr.opt);return t.stores.map(st=>{const iss=[];const need=st.base*liftOf(st,o,true)*dr.days;
  if(o.display&&!st.display)iss.push('No display space, runs price-only');
  if(st.stock<need*0.6)iss.push('Stock covers only part of the promotion');
  if(st.staff<2)iss.push('Only 1 staff hour free for set-up');
  return {st,iss,verdict:iss.length?'care':'go'}})}
function pbActive(pb){return !!pb&&(pb.status==='active'||pb.status==='pending_brand')}
function causeShare(t){const pb=PLAYBOOKS[t.brand];if(!pb)return .5;const s=pb.cause[t.cause]??.5;return Math.min(pb.terms.maxShare,Math.max(pb.terms.minShare,s))}
function playbook(dr,o,t){
  const pb=PLAYBOOKS[t.brand];
  if(!pbActive(pb))return [[false,pb?`${t.brand} playbook is proposed but not signed (Deal room)`:`No playbook with ${t.brand}`]];
  const T=pb.terms,fund=trigPlan(t,dr).fund,left=T.budget-pb.used;
  return [[o.d<=T.maxDiscount+1e-9,`Discount ${pct(o.d)}, limit ${pct(T.maxDiscount)}`],[dr.share>=T.minShare-1e-9&&dr.share<=T.maxShare+1e-9,`Brand funds ${pct(dr.share)}, allowed ${pct(T.minShare)}–${pct(T.maxShare)}`],[dr.days<=T.maxDays,`${dr.days} days, limit ${T.maxDays}`],[fund<=left,`Funding ${money(fund)}, ${money(left)} left this month`]];
}
function series(t){const base=t.stores.reduce((s,st)=>s+st.base,0),pts=[];
  for(let i=0;i<21;i++){let a=base*(0.95+((i*13)%9)/100);

    if(t.id==='ched'&&i>=7)a=base*(1-.35*Math.min(1,(i-6)/5))*(0.95+((i*5)%9)/100);
    pts.push({plan:base,a})}return pts}
function dayIdx(deal,abs){return abs-deal.startDay+1}
function simDay(deal,abs){
  const dn=dayIdx(deal,abs);if(dn<1||dn>deal.days)return;
  deal.stores.forEach((st,i)=>{
    const ex=st.conf!=null&&st.conf<abs;
    const boost=(deal.offer&&deal.offer.from<=abs&&deal.offer.stores.includes(st.n))?0.12:0;
    const f=st.base*liftOf(st,deal.opt,true);
    const want=st.base*liftOf(st,deal.opt,ex,boost)*noise(i,dn);
    const a=Math.min(st.remaining,want);
    st.remaining-=a;st.hist.push({dn,f,a,ex,short:want-a});
  });
  let tf=0,ta=0;deal.stores.forEach(st=>{const h=st.hist[st.hist.length-1];if(h&&h.dn===dn){tf+=h.f;ta+=h.a}});
  log(deal,'sales',`Day ${dn}: ${R(ta)} sold vs ${R(tf)} forecast`,'CAR',abs,1260);
}
function launch(deal){

function recs(deal){
  if(deal.status!=='live')return [];
  const dn=liveDay(deal),left=deal.days-dn,out=[];if(dn<1)return out;
  deal.stores.forEach(st=>{
    if(st.conf==null&&st.nudged==null)out.push({id:'nudge-'+st.n,lever:'Store execution',store:st.n,text:`${st.n} hasn’t confirmed set-up after ${dn} day${dn>1?'s':''}. Nudge the store and pause replenishment of this item until it does.`,act:'Nudge and pause'});
  });
  if(left>0){
    const rate=st=>st.base*liftOf(st,deal.opt,true);
    const short=deal.stores.filter(st=>st.conf!=null&&st.remaining<rate(st)*left*0.8).map(st=>({st,need:R(rate(st)*left-st.remaining)})).filter(x=>x.need>=15);
    const surplus=deal.stores.map(st=>({st,spare:R(st.remaining-rate(st)*left*1.1)})).filter(x=>x.spare>15).sort((a,b)=>b.spare-a.spare);
    short.forEach(({st,need})=>{
      const donor=surplus.find(x=>x.st.n!==st.n&&x.spare>=15);
      if(donor){const q=Math.min(need,donor.spare);out.push({id:'move-'+st.n,lever:'Stock between stores',store:st.n,text:`${st.n} sells out in about ${Math.max(1,R(st.remaining/rate(st)))} day${R(st.remaining/rate(st))>1?'s':''}. Move ${q} units from ${donor.st.n}, which won’t sell them before the promotion ends.`,act:`Move ${q} units`,q,from:donor.st.n,to:st.n});donor.spare-=q;}
      else out.push({id:'exp-'+st.n,lever:'Expedite from DC',store:st.n,text:`${st.n} sells out early and no store has spare stock. Expedite ${need} units from the distribution centre.`,act:`Expedite ${need}`,q:need,to:st.n});
    });
    const cumF=deal.stores.reduce((s,st)=>s+st.hist.reduce((x,h)=>x+h.f,0),0),cumA=deal.stores.reduce((s,st)=>s+st.hist.reduce((x,h)=>x+h.a,0),0);
    if(!deal.offer&&cumA<cumF*0.88){
      const slow=deal.stores.filter(st=>{const f=st.hist.reduce((x,h)=>x+h.f,0),a=st.hist.reduce((x,h)=>x+h.a,0),sh=st.hist.reduce((x,h)=>x+h.short,0);return a<f*0.92&&st.conf!=null&&sh<1}).map(st=>st.n);
      if(slow.length)out.push({id:'offer',lever:'Digital offer',text:`${slow.join(', ')} set up the promotion and have stock, but sales are below forecast. Send the deal to loyalty-app shoppers of ${slow.length>1?'those stores':'that store'} through Engagement Cloud.`,act:'Send app offer',stores:slow});
    }
  } else out.push({id:'wave',lever:'Next wave',text:'The promotion ends today. Repeat it in the stores that beat forecast, and skip the stores that didn’t set up.',act:'Plan next wave'});
  return out.filter(r=>!deal.dismissed[r.id]&&!deal.done[r.id]);
}
function dealTotals(deal){
  let f=0,a=0,fEx=0,aEx=0;
  deal.stores.forEach(st=>st.hist.forEach(h=>{f+=h.f;a+=h.a;if(st.conf!=null){fEx+=h.f;aEx+=h.a}}));
  const p=deal.trig,o=deal.opt;
  return {f,a,fEx,aEx,profitPlan:f*(p.P*(1-o.d)-p.C)+f*p.P*o.d*deal.share,profitAct:a*(p.P*(1-o.d)-p.C)+a*p.P*o.d*deal.share};

function replan(deal){let f=0,w=0;deal.stores.forEach(st=>{const c=storePlan(st,deal.opt,deal.days,deal.trig.P,deal.trig.C,deal.trig.G,deal.share,deal.trig.expiry);f+=c.fund;w+=c.wasteAvoid});deal.fund=f;deal.wastePlan=w}
function counter(deal){

  const d=Math.min(deal.opt.d,T.maxDiscount),share=Math.min(T.maxShare,Math.max(T.minShare,deal.share)),days=Math.min(deal.days,T.maxDays);
  const capped=d<deal.opt.d-1e-9;
  const opt=capped?{...deal.opt,d,label:/\d+% off/.test(deal.opt.label)?deal.opt.label.replace(/\d+% off/,pct(d)+' off'):pct(d)+' off'}:deal.opt;
  const ch=[];if(capped)ch.push(`the discount capped at ${pct(d)}`);if(Math.abs(share-deal.share)>1e-9)ch.push(`our share at ${pct(share)}`);if(days!==deal.days)ch.push(`${days} days`);
  const pre=pbActive(pb)?'':'We don’t have a signed playbook yet, so this one goes deal by deal. ';
  deal.counterTerms={opt,share,days};
  log(deal,'exception',`${t.approver} countered: ${ch.length?ch.join(', '):'will fund as asked'}`,'Trade Mgmt');
  deal.thread.push({who:'cpg',name:t.approver+', '+t.brand,text:pre+(ch.length?`We’ll fund it with ${ch.join(', ')}. ${pbActive(pb)?'That keeps it inside the terms we’ve agreed.':'That matches the playbook we sent you.'}`:'We’ll fund this one as asked.')});
  toast(`${t.approver} countered on ${short(t.product).toLowerCase()}`,{label:'Review',fn:()=>setTab('deals')});
}
function acceptCounter(deal){const c=deal.counterTerms;deal.opt=c.opt;deal.share=c.share;deal.days=c.days;replan(deal);deal.status='approved';deal.auto=false;deal.approvedAt=dayLabel();deal.counterTerms=null;commitFunding(deal);S.trackSel=deal.id;
  log(deal,'approve',`Dana accepted the counter. ${deal.fund?money(deal.fund)+' committed':'Retailer-funded'}`,'Trade Mgmt');
  toast('Counter accepted. Ready to launch',{label:'Launch now',fn:()=>doLaunch(deal)})}
function runSolo(deal){deal.share=0;replan(deal);deal.status='approved';deal.auto=false;deal.approvedAt=dayLabel()+', retailer-funded';deal.counterTerms=null;S.trackSel=deal.id;
  log(deal,'approve','Dana chose to run it retailer-funded','Promo Pulse');toast('Running it retailer-funded. Ready to launch',{label:'Launch now',fn:()=>doLaunch(deal)})}
function proposeTerms(b){
  const pb=PLAYBOOKS[b],id=slug(b),v=k=>parseFloat(($(`e-${id}-${k}`)||{}).value);
  const n={maxDiscount:v('max')/100,maxDays:R(v('days')),minShare:v('min')/100,maxShare:v('maxs')/100,budget:R(v('fund'))};
  let err=null;
  if(Object.values(n).some(x=>!isFinite(x)))err='Fill in every field, then send again.';
  else if(n.maxDiscount<=0||n.maxDiscount>.5)err='Max discount has to be between 5% and 50%.';
  else if(n.maxDays<1||n.maxDays>14)err='Max length has to be 1 to 14 days.';
  else if(n.minShare<0||n.maxShare>1)err='Brand shares have to be between 0% and 100%.';
  else if(n.minShare>n.maxShare)err='“Brand funds at least” is higher than “at most”. Lower one of them.';
  else if(n.budget<0)err='The monthly fund can’t be negative.';
  if(err){S.editErr=err;S.editVals=null;return}
  S.editErr=null;S.editing=null;S.editVals=null;pb.pending=n;pb.status='pending_brand';
  toast(`New terms sent to ${pb.contact}`);
  later(1600,()=>{pb.terms=pb.pending;pb.pending=null;pb.ver++;pb.signed=dayLabel();pb.status='active';toast(`${pb.contact} signed ${b} playbook v${pb.ver}`)});
}
function doLaunch(deal){if(deal.status!=='approved')return;launch(deal);if(S.tab!=='execute')setTab('execute');render();toast(`Live in PMR and OPP from ${dateOf(deal.startDay)}. Store confirmations are coming in.`)}

function nice(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const m=x/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}
function chart(deal){
  const D=deal.days,W=560,H=220,L=44,Rm=12,T=16,B=30,ld=liveDay(deal);
  const days=[...Array(D)].map((_,i)=>{const dn=i+1;let f=0,a=0,has=false;deal.stores.forEach(st=>{const h=st.hist.find(x=>x.dn===dn);if(h){f+=h.f;a+=h.a;has=true}else f+=st.base*liftOf(st,deal.opt,true)});return {dn,f,a,has}});
  const maxV=Math.max(...days.map(d=>Math.max(d.f,d.a)))*1.15||1,step=nice(maxV/4),top=Math.ceil(maxV/step)*step,y=v=>T+(H-T-B)*(1-v/top),cw=(W-L-Rm)/D,bw=Math.min(34,cw*.5);
  let g='';for(let v=0;v<=top+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-Rm}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${R(v)}</text>`;
  days.forEach((d,i)=>{const x=L+cw*i+cw/2,cur=d.dn===ld&&deal.status==='live';

    g+=`<line x1="${x-bw/2-6}" x2="${x+bw/2+6}" y1="${y(d.f)}" y2="${y(d.f)}" stroke="var(--tick)" stroke-width="3" stroke-linecap="round"/>`;

const JQS=['What should I act on today?','Why is yogurt at risk?','Where is each deal right now?','Which brand playbooks are signed?','Why is the orange juice promotion flat in Riverside?'];
function answer(q){
  const t=q.toLowerCase(),live=S.deals.filter(d=>d.status==='live');
  const storeHit=STORE_NAMES.find(n=>new RegExp('\\b'+n.toLowerCase().split(' ')[0]+'\\b').test(t));
  if(storeHit&&(t.includes('why')||t.includes('flat')||t.includes('slow')||t.includes('behind'))){
    const d=live.find(x=>x.trig.product.toLowerCase().split(' ').some(w=>w.length>3&&t.includes(w)))||live[0];
    if(!d)return 'No promotion is live right now.';
    const st=d.stores.find(s=>s.n===storeHit),f=st.hist.reduce((x,h)=>x+h.f,0),a=st.hist.reduce((x,h)=>x+h.a,0);
    if(st.conf==null)return `<b>${esc(storeHit)}</b> sold ${R(a)} of ${R(f)} forecast units of ${esc(d.trig.product)} because the store hasn’t confirmed set-up, so shoppers likely never saw the deal. That’s an execution gap, not a weak promotion. Monitor has a nudge ready that also pauses replenishment until it’s set up.`;
    return `<b>${esc(storeHit)}</b> set up the promotion and sold ${R(a)} of ${R(f)} forecast units (${pct(f?a/f:0)}). ${st.remaining<st.base*2?'It’s close to selling out, so check the stock-move recommendation in Monitor.':'Stock is fine for the rest of the promotion.'}`;
  }
  const trg=TRIGGERS.find(x=>t.includes(x.kw));
  if(trg&&(t.includes('why')||t.includes('risk'))){
    const pb=PLAYBOOKS[trg.brand],op=trg.options.find(o=>o.id===trg.rec);
    return `<b>${esc(trg.product)}</b>: ${trg.facts.map(esc).join('. ')}. Cause: ${esc(CAUSES[trg.cause].label.toLowerCase())}. At today’s rate, ${R(atRisk(trg))} units ${trg.kind==='Overstock'?'sit beyond target cover':'expire unsold'}. I’d start with <b>${esc(op.label)}</b>${pbActive(pb)?`, which fits the ${esc(trg.brand)} playbook`:''}.`;
  }
  if(t.includes('where')||t.includes('step')||t.includes('status')){
    if(!S.deals.length)return 'No deals in flight.';
    return S.deals.map(d=>{const sg=stageList(d),cur=sg.find(x=>x[1]==='now')||sg.find(x=>x[1]==='')||sg[sg.length-1],ev=sortedTrack(d).pop();
      return `<b>${esc(d.trig.product)}</b>: ${esc(cur[0])}${cur[2]?' ('+esc(cur[2])+')':''}. Last step: ${ev?esc(ev.text)+', '+dateOf(ev.abs)+' at '+fmtTime(ev.m):'none yet'}.`}).join('<br><br>');
  }
  if(t.includes('playbook')||t.includes('signed')||t.includes('fund')){
    return Object.entries(PLAYBOOKS).map(([b,pb])=>`<b>${esc(b)}</b>: ${pb.status==='pending_retailer'?`proposed by ${esc(pb.contact)}, waiting for your signature in the Deal room`:`v${pb.ver} signed by both sides, ${money(pb.terms.budget-pb.used)} of ${money(pb.terms.budget)} left this month`}.`).join('<br>');
  }
  if(t.includes('act')||t.includes('today')||t.includes('need')){
    const open=openT(),r=live.reduce((n,d)=>n+recs(d).length,0),ex=S.deals.filter(d=>d.status==='negotiate').length;
    return `${open.length?`<b>${open.length} trigger${open.length>1?'s':''} in Suggest:</b> ${open.map(x=>`${esc(x.product)} (${esc(x.kind.toLowerCase())}, ${R(atRisk(x))} units at risk)`).join('; ')}. `:'No open triggers. '}${r?`<b>${r} recommendation${r>1?'s':''}</b> waiting in Monitor. `:''}${ex?`<b>${ex} exception${ex>1?'s':''}</b> open in the Deal room.`:''}`;
  }
  if(t.includes('plan')||t.includes('doing')||t.includes('profit')||t.includes('how')){
    if(!live.length)return 'No promotions are live.';
    return live.map(d=>{const x=dealTotals(d);return `<b>${esc(d.trig.product)}</b>: day ${liveDay(d)} of ${d.days}, ${R(x.a)} units vs ${R(x.f)} forecast (${pct(x.f?x.a/x.f:0)}). Stores that set up are at ${pct(x.fEx?x.aEx/x.fEx:0)} of forecast.`}).join('<br>');
  }
  return 'I can answer questions about this workspace: what needs you today, why a product is at risk, where each deal is, how live promotions are doing, or why a store is behind.';
}

  const g=k=>e.target.closest('['+k+']');let el;
  if(el=g('data-close-joule')){closeJoule();return}
  if(el=g('data-open-joule')){openJoule();return}
  if(el=g('data-q')){ask(el.dataset.q);return}
  if(el=g('data-tab')){setTab(el.dataset.tab);return}
  if(el=g('data-sel')){S.sel=el.dataset.sel;renderSuggest();animateNums();return}
  if(el=g('data-opt')){S.draft[S.sel].opt=el.dataset.opt;renderSuggest();animateNums();return}
  if(el=g('data-inc')){const ex=S.draft[S.sel].exclude,n=el.dataset.inc;ex[n]=!ex[n];renderSuggest();animateNums();return}
  if(el=g('data-launch')){doLaunch(S.deals.find(x=>x.id===el.dataset.launch));return}
  if(el=g('data-goto')){setTab(el.dataset.goto);return}
  if(el=g('data-edit')){S.editing=el.dataset.edit;S.editErr=null;S.editVals=null;renderDeals();return}
  if(el=g('data-cancel')){S.editing=null;S.editErr=null;S.editVals=null;renderDeals();return}
  if(el=g('data-propose')){proposeTerms(el.dataset.propose);render();return}
  if(el=g('data-sign')){const b=el.dataset.sign,pb=PLAYBOOKS[b];pb.status='active';pb.signed=dayLabel();TRIGGERS.filter(t=>t.brand===b).forEach(t=>{if(!S.deals.some(d=>d.id===t.id))S.draft[t.id].share=causeShare(t)});render();toast(`${b} playbook signed. Deals inside it now auto-approve.`);return}
  if(el=g('data-accept')){acceptCounter(S.deals.find(x=>x.id===el.dataset.accept));setTab('execute');render();return}
  if(el=g('data-solo')){runSolo(S.deals.find(x=>x.id===el.dataset.solo));setTab('execute');render();return}
  if(el=g('data-mon')){S.monitorSel=el.dataset.mon;if(S.tab!=='monitor')setTab('monitor');render();return}
  if(el=g('data-dis')){const d=S.deals.find(x=>x.id===S.monitorSel);d.dismissed[el.dataset.dis]=true;render();return}
  if(el=g('data-rec')){
    const d=S.deals.find(x=>x.id===S.monitorSel),r=recs(d).find(x=>x.id===el.dataset.rec);if(!r)return;
    const when=dateOf(S.today);
    if(r.id.startsWith('nudge')){const st=d.stores.find(s=>s.n===r.store);st.nudged=S.today;d.events.push(`${when}: nudged ${r.store}; replenishment paused until set-up (S/4HANA)`)}
    else if(r.id.startsWith('move')){const a=d.stores.find(s=>s.n===r.from),b=d.stores.find(s=>s.n===r.to);a.remaining-=r.q;b.remaining+=r.q;d.events.push(`${when}: moved ${r.q} units ${r.from} → ${r.to} (S/4HANA stock transfer)`)}
    else if(r.id.startsWith('exp')){const b=d.stores.find(s=>s.n===r.to);b.remaining+=r.q;d.events.push(`${when}: expedited ${r.q} units to ${r.to} from the DC`)}
    else if(r.id==='offer'){d.offer={from:S.today+1,stores:r.stores};d.events.push(`${when}: app offer sent to shoppers of ${r.stores.join(', ')} (Engagement Cloud)`)}
    else if(r.id==='wave'){d.events.push(`${when}: next wave planned for the stores that beat forecast`)}
    d.done[r.id]=true;
    const SY={nudge:'Store app',move:'S/4HANA',exp:'S/4HANA',offer:'Engagement Cloud',wave:'Promo Pulse'},txt=d.events[d.events.length-1].replace(/^.*?: /,'').replace(/\s*\([^)]*\)$/,'');
    log(d,'agent','Approved by Dana: '+txt,SY[r.id.split('-')[0]]||'Promo Pulse');
    render();toast('Done: '+txt);return}
  const a=g('data-act');
  if(a&&a.dataset.act==='send'){
    const t=TRIGGERS.find(x=>x.id===S.sel),dr=S.draft[t.id],o=t.options.find(x=>x.id===dr.opt),checks=playbook(dr,o,t),inPb=checks.every(x=>x[0]),plan=trigPlan(t,dr),pbx=PLAYBOOKS[t.brand];
    const deal={id:t.id,trig:t,opt:o,days:dr.days,share:dr.share,status:inPb?'approved':'negotiate',auto:inPb,fund:plan.fund,pbVer:pbx?pbx.ver:null,thread:[],track:[],created:S.today,startDay:null,wastePlan:plan.wasteAvoid,
      stores:t.stores.filter(st=>!dr.exclude[st.n]).map(st=>({...st,start:st.stock,remaining:st.stock,conf:null,nudged:null,hist:[]})),offer:null,dismissed:{},done:{},events:[]};
    const left=t.stores.length-deal.stores.length;
    log(deal,'detect',`${t.kind} flagged: ${R(atRisk(t))} units at risk in ${t.stores.length} stores`,'S/4HANA + CAR',S.today,425);
    log(deal,'decide',`Dana picked ${o.label}, ${dr.days} days, ${t.brand} funds ${pct(dr.share)}${left?`, ${left} store${left>1?'s':''} left out`:''}`,'Promo Pulse');
    S.trackSel=deal.id;
    if(inPb){log(deal,'approve',`Inside all ${checks.length} playbook rules. Auto-approved under v${pbx.ver}, ${money(plan.fund)} committed`,'Trade Mgmt');commitFunding(deal);deal.approvedAt=dayLabel()}
    else{log(deal,'exception',`Outside the playbook on: ${checks.filter(x=>!x[0]).map(x=>x[1]).join('; ')}. Sent to ${t.approver} as an exception`,'Deal room');
      deal.thread.push({who:'ret',name:'Dana Ortiz',text:`${o.label}, ${dr.days} days, brand funds ${pct(dr.share)}. Outside the playbook on: ${checks.filter(x=>!x[0]).map(x=>x[1]).join('; ')}.`});
      later(700,()=>log(deal,'exception',`${t.approver} opened it in SAP Trade Management`,'Trade Mgmt'));
      later(1600,()=>counter(deal))}
    S.deals.push(deal);setTab(inPb?'execute':'deals');render();
    if(inPb)toast(`Auto-approved under ${t.brand} playbook v${pbx.ver} · ${money(plan.fund)} committed`,{label:'Launch now',fn:()=>doLaunch(deal)});
    else toast(`Sent to ${t.approver} as an exception`);
    try{window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'})}catch(err){}
    return;
  }
  if(a&&a.dataset.act==='nextday'){
    S.today++;S.clock=540;let ended=[];
    S.deals.forEach(d=>{if(d.status!=='live')return;
      d.stores.forEach(st=>{if(st.conf==null&&st.nudged!=null&&S.today>st.nudged){st.conf=S.today-1;log(d,'store',`${st.n} confirmed set-up after the nudge`,'Store app',S.today-1,1150)}});
      simDay(d,S.today);
      if(S.today>d.startDay+d.days){d.status='done';ended.push(d);const x=dealTotals(d);log(d,'end',`Ended. ${R(x.a)} sold vs ${R(x.f)} forecast; stores that set up hit ${pct(x.fEx?x.aEx/x.fEx:0)} of forecast`,'CAR',S.today,480)}
    });
    render();
    const liveN=S.deals.filter(d=>d.status==='live').length;
    toast(`${dateOf(S.today)} · overnight sales loaded from CAR${ended.length?`, ${ended.length} promotion${ended.length>1?'s':''} ended`:''}`,liveN?{label:'Monitor',fn:()=>setTab('monitor')}:null);
    return;
  }
  if(el=g('data-track')){S.trackSel=el.dataset.track;if(S.tab!=='execute')setTab('execute');renderExecute();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('joule').classList.contains('open')){closeJoule();return}
  const card=e.target.closest&&e.target.closest('[role="button"][data-track]');
  if(card&&e.target===card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();card.click();return}
  const t=e.target.closest&&e.target.closest('[role="tab"]');if(!t)return;
  const i=TABS.findIndex(x=>x[0]===t.dataset.tab),N=TABS.length;let j=null;
  if(e.key==='ArrowRight')j=(i+1)%N;else if(e.key==='ArrowLeft')j=(i+N-1)%N;else if(e.key==='Home')j=0;else if(e.key==='End')j=N-1;
  if(j==null)return;e.preventDefault();setTab(TABS[j][0]);$('t-'+TABS[j][0]).focus();
});
$('sform').addEventListener('submit',e=>{e.preventDefault();const q=$('sq').value.trim();if(!q){$('sq').focus();return}$('sq').value='';ask(q)});
$('jform').addEventListener('submit',e=>{e.preventDefault();const q=$('jq').value.trim();if(!q)return;$('jq').value='';ask(q)});

document.querySelectorAll('[data-ic]').forEach(x=>{x.innerHTML=ic(x.dataset.ic,+x.dataset.sz||18)});
render();pulseAnim();
})();
</script>
